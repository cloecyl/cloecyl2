<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unpaid Payments Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #faf5f5;
    --border: #e8e1e1;
    --ink: #2b2b2b;
    --muted: #6b6b6b;
    --red: #a3242f;
    --red-dark: #7f1b24;
    --red-pale: #fdf0ef;
    --amber: #d97706;
    --green: #15803d;
    --green-pale: #f0fdf4;
    --bar-track: #f3ecec;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Arial, Helvetica, "Segoe UI", sans-serif;
  }

  .topbar {
    background: var(--red-pale);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
  }

  .topbar-inner {
    max-width: 1040px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }

  .brand-mark {
    font-weight: 800;
    font-size: 20px;
    color: var(--red);
    letter-spacing: 0.02em;
  }

  .brand-sub {
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  .contact-btn {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 700;
    cursor: default;
  }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 40px 32px 90px;
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .eyebrow-bar {
    width: 36px;
    height: 4px;
    background: var(--red);
    border-radius: 2px;
  }

  .eyebrow-text {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: var(--red);
    text-transform: uppercase;
  }

  h1 {
    font-size: 26px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    margin: 0 0 4px;
    color: var(--ink);
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 32px;
  }

  .status-banner {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 6px;
    margin-bottom: 24px;
  }

  .status-banner.show { display: flex; }
  .status-banner.loading { background: var(--surface-alt); color: var(--muted); }
  .status-banner.error { background: #fef2f2; color: var(--red); border: 1px solid #fecaca; }

  /* Stat cards */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 36px;
  }

  @media (max-width: 680px) {
    .stat-row { grid-template-columns: 1fr; }
  }

  .stat-card {
    border-radius: 8px;
    padding: 22px 24px;
    min-width: 0;
  }

  .stat-card.primary {
    background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
    color: #fff;
  }

  .stat-card.outline {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--ink);
  }

  .stat-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 0 0 10px;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .stat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .stat-card.outline .stat-dot.amber { background: var(--amber); }
  .stat-card.outline .stat-dot.green { background: var(--green); }

  .stat-value {
    font-size: 30px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin: 0;
    line-height: 1.1;
  }

  .stat-sub {
    font-size: 12.5px;
    margin: 6px 0 0;
    opacity: 0.85;
  }

  /* Chart card */
  .chart-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 24px 20px;
    margin-bottom: 40px;
  }

  .card-title {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 0 0 18px;
  }

  .chart {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    height: 220px;
    padding-top: 10px;
  }

  .bar-col {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
    gap: 8px;
  }

  .bar-value {
    font-size: 11px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  .bar-track {
    width: 100%;
    max-width: 48px;
    height: 100%;
    background: var(--bar-track);
    border-radius: 6px 6px 0 0;
    display: flex;
    align-items: flex-end;
    overflow: hidden;
  }

  .bar-fill {
    width: 100%;
    background: linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%);
    border-radius: 6px 6px 0 0;
    transition: height 0.25s ease;
  }

  .bar-label {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    line-height: 1.3;
    word-break: break-word;
  }

  .chart-empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 60px 0;
  }

  /* Overdue list */
  .section-label {
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .section-sub {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 18px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--surface);
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
  }

  .list .row:last-child {
    border-bottom: none;
  }

  .row.overdue {
    background: var(--red-pale);
  }

  .row-info {
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .avatar {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--red);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
  }

  .row.overdue .avatar {
    background: var(--red-dark);
  }

  .row-text { min-width: 0; }

  .row-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .customer {
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
  }

  .amount {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: 14px;
    color: var(--red);
  }

  .meta {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 3px;
  }

  .days-late {
    font-weight: 700;
    color: var(--amber);
  }

  .days-late.critical {
    color: var(--red);
  }

  .pay-btn {
    flex-shrink: 0;
    border: 1px solid var(--red);
    background: #fff;
    color: var(--red);
    font-size: 12.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 9px 16px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .pay-btn:hover:not(:disabled) {
    background: var(--red);
    color: #fff;
  }

  .pay-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    padding: 48px 20px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: var(--surface-alt);
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark">SPGG FINANCE</span>
      <span class="brand-sub">MEMBER ACCOUNTS</span>
    </div>
    <button class="contact-btn">Contact Us</button>
  </div>
</div>

<div class="wrap">
  <div class="eyebrow">
    <span class="eyebrow-bar"></span>
    <span class="eyebrow-text">Accounts Receivable</span>
  </div>
  <h1>Unpaid Payments Dashboard</h1>
  <p class="subtitle">As of <span id="todayLabel"></span> · live from Supabase</p>

  <div class="status-banner" id="statusBanner"></div>

  <div class="stat-row">
    <div class="stat-card primary">
      <p class="stat-label">Total Owed</p>
      <p class="stat-value" id="statTotalOwed">—</p>
      <p class="stat-sub" id="statTotalSub"></p>
    </div>
    <div class="stat-card outline">
      <p class="stat-label"><span class="stat-dot amber"></span>Overdue Invoices</p>
      <p class="stat-value" id="statOverdueCount">—</p>
      <p class="stat-sub" id="statOverdueSub"></p>
    </div>
    <div class="stat-card outline">
      <p class="stat-label"><span class="stat-dot green"></span>Paid This Month</p>
      <p class="stat-value" id="statPaidAmount">—</p>
      <p class="stat-sub" id="statPaidSub"></p>
    </div>
  </div>

  <div class="chart-card">
    <p class="card-title">Amount Owed by Customer</p>
    <div class="chart" id="chart"></div>
  </div>

  <p class="section-label">Overdue Invoices</p>
  <p class="section-sub">Sorted by days late</p>
  <div class="list" id="invoiceList"></div>
</div>

<script>
  // ---- Supabase setup ----
  const SUPABASE_URL = "https://apgfrhmuwrtoaxxhylzb.supabase.co";
  const SUPABASE_KEY = "sb_publishable_N5s-BxNyHPtdGPn0Rg-jZA_DrEEieBW";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const TODAY = new Date();

  let unpaidInvoices = [];
  let paidThisMonth = [];

  function daysLate(dueDateStr) {
    const due = new Date(dueDateStr + "T00:00:00");
    const diffMs = TODAY - due;
    return Math.floor(diffMs / (1000 * 60 * 60 * 24));
  }

  function formatSGD(n) {
    return "SGD " + Number(n).toLocaleString("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(dueDateStr) {
    const d = new Date(dueDateStr + "T00:00:00");
    return d.toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });
  }

  function initials(name) {
    return name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
  }

  function showStatus(message, type) {
    const el = document.getElementById("statusBanner");
    if (!message) {
      el.className = "status-banner";
      el.textContent = "";
      return;
    }
    el.className = "status-banner show " + type;
    el.textContent = message;
  }

  function monthStartISO() {
    const d = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
    return d.toISOString();
  }

  async function loadData() {
    showStatus("Loading invoices from Supabase…", "loading");

    const [unpaidRes, paidRes] = await Promise.all([
      supabaseClient
        .from("invoices")
        .select("*")
        .eq("paid", false)
        .order("due_date", { ascending: true }),
      supabaseClient
        .from("invoices")
        .select("*")
        .eq("paid", true)
        .gte("paid_at", monthStartISO())
    ]);

    if (unpaidRes.error || paidRes.error) {
      const err = unpaidRes.error || paidRes.error;
      showStatus("Couldn't load data from Supabase: " + err.message, "error");
      return;
    }

    unpaidInvoices = unpaidRes.data;
    paidThisMonth = paidRes.data;
    showStatus("", "");
    renderAll();
  }

  function renderStats() {
    const totalOwed = unpaidInvoices.reduce((sum, inv) => sum + Number(inv.amount), 0);
    const overdue = unpaidInvoices.filter(inv => daysLate(inv.due_date) > 0);
    const overdueTotal = overdue.reduce((sum, inv) => sum + Number(inv.amount), 0);
    const paidTotal = paidThisMonth.reduce((sum, inv) => sum + Number(inv.amount), 0);

    document.getElementById("statTotalOwed").textContent = formatSGD(totalOwed);
    document.getElementById("statTotalSub").textContent =
      unpaidInvoices.length + (unpaidInvoices.length === 1 ? " invoice outstanding" : " invoices outstanding");

    document.getElementById("statOverdueCount").textContent = overdue.length;
    document.getElementById("statOverdueSub").textContent = formatSGD(overdueTotal) + " total";

    document.getElementById("statPaidAmount").textContent = formatSGD(paidTotal);
    document.getElementById("statPaidSub").textContent =
      paidThisMonth.length + (paidThisMonth.length === 1 ? " invoice settled" : " invoices settled");
  }

  function renderChart() {
    const chartEl = document.getElementById("chart");

    if (unpaidInvoices.length === 0) {
      chartEl.innerHTML = '<div class="chart-empty">No outstanding balances to chart.</div>';
      return;
    }

    const maxAmount = Math.max(...unpaidInvoices.map(inv => Number(inv.amount)));
    const sortedByAmount = [...unpaidInvoices].sort((a, b) => Number(b.amount) - Number(a.amount));

    chartEl.innerHTML = sortedByAmount.map(inv => {
      const pct = Math.max((Number(inv.amount) / maxAmount) * 100, 4);
      return `
        <div class="bar-col">
          <span class="bar-value">${formatSGD(inv.amount)}</span>
          <div class="bar-track">
            <div class="bar-fill" style="height:${pct}%"></div>
          </div>
          <span class="bar-label">${inv.customer}</span>
        </div>
      `;
    }).join("");
  }

  function renderList() {
    const listEl = document.getElementById("invoiceList");

    if (unpaidInvoices.length === 0) {
      listEl.innerHTML = '<div class="empty">No unpaid invoices. All accounts are settled.</div>';
      return;
    }

    const sorted = [...unpaidInvoices]
      .map(inv => ({ ...inv, _daysLate: daysLate(inv.due_date) }))
      .sort((a, b) => b._daysLate - a._daysLate);

    listEl.innerHTML = sorted.map(inv => {
      const critical = inv._daysLate > 30;
      return `
        <div class="row ${critical ? "overdue" : ""}">
          <div class="row-info">
            <div class="avatar">${initials(inv.customer)}</div>
            <div class="row-text">
              <div class="row-top">
                <span class="customer">${inv.customer}</span>
                <span class="amount">${formatSGD(inv.amount)}</span>
              </div>
              <div class="meta">
                Due ${formatDate(inv.due_date)} ·
                <span class="days-late ${critical ? "critical" : ""}">${inv._daysLate} days late</span>
              </div>
            </div>
          </div>
          <button class="pay-btn" data-id="${inv.id}">Mark as Paid</button>
        </div>
      `;
    }).join("");

    listEl.querySelectorAll(".pay-btn").forEach(btn => {
      btn.addEventListener("click", () => markAsPaid(btn));
    });
  }

  async function markAsPaid(btn) {
    const id = btn.getAttribute("data-id");
    btn.disabled = true;
    btn.textContent = "Saving…";

    const { data, error } = await supabaseClient
      .from("invoices")
      .update({ paid: true, paid_at: new Date().toISOString() })
      .eq("id", id)
      .select();

    if (error) {
      showStatus("Couldn't save: " + error.message, "error");
      btn.disabled = false;
      btn.textContent = "Mark as Paid";
      return;
    }

    const paidInvoice = (data && data[0]) || unpaidInvoices.find(inv => inv.id === id);
    unpaidInvoices = unpaidInvoices.filter(inv => inv.id !== id);
    paidThisMonth.push(paidInvoice);
    showStatus("", "");
    renderAll();
  }

  function renderAll() {
    renderStats();
    renderChart();
    renderList();
  }

  document.getElementById("todayLabel").textContent =
    TODAY.toLocaleDateString("en-SG", { day: "numeric", month: "long", year: "numeric" });

  loadData();
</script>
</body>
</html>
