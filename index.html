<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unpaid Payments Tracker</title>
<style>
  :root {
    --bg1: #fff1f8;
    --bg2: #eef9ff;
    --card: #ffffff;
    --ink: #2b1a4a;
    --muted: #8c7ba3;
    --pink: #ff5fa2;
    --purple: #8b5cf6;
    --yellow: #ffc73c;
    --mint: #2dd4bf;
    --red: #ff4d6d;
    --border: #f0e6fb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: "Baloo 2", "Comic Sans MS", "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 40px 20px 100px;
  }

  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap');

  body { font-family: "Nunito", -apple-system, sans-serif; }
  h1, .total-amount, .customer { font-family: "Baloo 2", "Nunito", sans-serif; }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 28px;
    text-align: center;
  }

  .emoji-row {
    font-size: 32px;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 28px;
    font-weight: 800;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
    font-weight: 600;
  }

  .total-card {
    background: linear-gradient(120deg, var(--pink), var(--purple));
    border-radius: 24px;
    padding: 28px 28px;
    margin-bottom: 32px;
    color: #fff;
    box-shadow: 0 14px 30px -10px rgba(139, 92, 246, 0.5);
    position: relative;
    overflow: hidden;
  }

  .total-card::after {
    content: "💸";
    position: absolute;
    font-size: 90px;
    right: -10px;
    bottom: -24px;
    opacity: 0.18;
    transform: rotate(-12deg);
  }

  .total-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 0 0 6px;
    opacity: 0.9;
  }

  .total-amount {
    font-size: 40px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }

  .total-sub {
    font-size: 13px;
    margin: 6px 0 0;
    font-weight: 600;
    opacity: 0.9;
  }

  .section-label {
    font-size: 15px;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 16px 18px;
    box-shadow: 0 4px 14px -8px rgba(139, 92, 246, 0.25);
    transition: transform 0.15s;
  }

  .row:hover {
    transform: translateY(-2px);
  }

  .row.overdue {
    border-color: var(--red);
    background: linear-gradient(135deg, #fff5f6 0%, #fff 60%);
  }

  .row-info {
    min-width: 0;
  }

  .row-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
  }

  .customer {
    font-weight: 700;
    font-size: 16px;
  }

  .amount {
    font-variant-numeric: tabular-nums;
    font-weight: 800;
    font-size: 15px;
    color: var(--purple);
  }

  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-weight: 600;
  }

  .days-late {
    font-weight: 800;
    padding: 2px 9px;
    border-radius: 999px;
    background: var(--yellow);
    color: #6b4800;
    display: inline-block;
  }

  .days-late.critical {
    background: var(--red);
    color: #fff;
  }

  .pay-btn {
    flex-shrink: 0;
    border: none;
    background: linear-gradient(120deg, var(--mint), #22c1b8);
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 6px 14px -6px rgba(45, 212, 191, 0.6);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .pay-btn:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 10px 18px -6px rgba(45, 212, 191, 0.7);
  }

  .pay-btn:active {
    transform: scale(0.97);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 15px;
    font-weight: 700;
    padding: 50px 20px;
    border: 2px dashed var(--border);
    border-radius: 18px;
    background: var(--card);
  }

  .empty .big {
    font-size: 40px;
    display: block;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="emoji-row">🎉 💰 🎊</div>
    <h1>Unpaid Payments Tracker</h1>
    <p class="subtitle">As of <span id="todayLabel"></span></p>
  </header>

  <div class="total-card">
    <p class="total-label">Total Owed</p>
    <p class="total-amount" id="totalAmount">SGD 0.00</p>
    <p class="total-sub" id="totalSub"></p>
  </div>

  <p class="section-label">🔥 Overdue Invoices (sorted by days late)</p>
  <div class="list" id="invoiceList"></div>
</div>

<script>
  const TODAY = new Date(2026, 10, 2); // Nov 2, 2026

  let invoices = [
    { customer: "Tan Trading",   amount: 1200, due_date: "2026-10-01" },
    { customer: "Lim Florist",   amount: 450,  due_date: "2026-10-12" },
    { customer: "Ong Bakery",    amount: 980,  due_date: "2026-09-25" },
    { customer: "Koh Events",    amount: 2300, due_date: "2026-10-20" },
    { customer: "Wong Printing", amount: 610,  due_date: "2026-10-05" },
    { customer: "Ng Catering",   amount: 1750, due_date: "2026-09-30" },
    { customer: "Lee Motors",    amount: 4100, due_date: "2026-10-08" },
    { customer: "Teo Logistics", amount: 1500, due_date: "2026-09-28" },
  ];

  function daysLate(dueDateStr) {
    const due = new Date(dueDateStr + "T00:00:00");
    const diffMs = TODAY - due;
    return Math.floor(diffMs / (1000 * 60 * 60 * 24));
  }

  function formatSGD(n) {
    return "SGD " + n.toLocaleString("en-SG", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDate(dueDateStr) {
    const d = new Date(dueDateStr + "T00:00:00");
    return d.toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });
  }

  function render() {
    const listEl = document.getElementById("invoiceList");
    const totalAmountEl = document.getElementById("totalAmount");
    const totalSubEl = document.getElementById("totalSub");

    const total = invoices.reduce((sum, inv) => sum + inv.amount, 0);
    totalAmountEl.textContent = formatSGD(total);
    totalSubEl.textContent = invoices.length + (invoices.length === 1 ? " invoice outstanding" : " invoices outstanding");

    if (invoices.length === 0) {
      listEl.innerHTML = '<div class="empty"><span class="big">🥳</span>All paid up! Nothing owed.</div>';
      return;
    }

    const sorted = [...invoices]
      .map((inv, idx) => ({ ...inv, _idx: idx, _daysLate: daysLate(inv.due_date) }))
      .sort((a, b) => b._daysLate - a._daysLate);

    listEl.innerHTML = sorted.map(inv => {
      const critical = inv._daysLate > 30;
      return `
        <div class="row ${critical ? "overdue" : ""}">
          <div class="row-info">
            <div class="row-top">
              <span class="customer">${inv.customer}</span>
              <span class="amount">${formatSGD(inv.amount)}</span>
            </div>
            <div class="meta">
              Due ${formatDate(inv.due_date)} ·
              <span class="days-late ${critical ? "critical" : ""}">${inv._daysLate}d late</span>
            </div>
          </div>
          <button class="pay-btn" data-idx="${inv._idx}">✓ Mark Paid</button>
        </div>
      `;
    }).join("");

    listEl.querySelectorAll(".pay-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const idx = Number(btn.getAttribute("data-idx"));
        invoices.splice(idx, 1);
        render();
      });
    });
  }

  document.getElementById("todayLabel").textContent = TODAY.toLocaleDateString("en-SG", { day: "numeric", month: "long", year: "numeric" });
  render();
</script>
</body>
</html>
